[changelog]
body = """

<img src="https://raw.githubusercontent.com/rinlit-233-shiroko/class-widgets-2/main/docs/assets/release_banner.png" width="100%" />

## Class Widgets 2 更新速递
> [!NOTE]
> 当前版本：`{% if version %}({{ version }}){%- endif -%}`

{% for group, commits in commits | group_by(attribute="group") %}

{% if group != "✨ 新亮点" %}
<details>
<summary><h3>{{ group | upper_first }}</h3></summary>
{% for commit in commits | unique(attribute="message") %}
- {% if commit.scope %}{{ commit.scope }}: {%- endif -%}{{ commit.message | upper_first }}\
  {% if commit.remote.username %} 作者: @{{ commit.remote.username }}{%- endif -%}
  {% if commit.remote.pr_number %} 在 \
[#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
{%- endif %}
{% endfor %}
</details>
{% else %}
### {{ group | upper_first }}
{% for commit in commits | unique(attribute="message") %}
- {% if commit.scope %}{{ commit.scope }}: {%- endif -%}{{ commit.message | upper_first }}\
  {% if commit.remote.username %} 作者: @{{ commit.remote.username }}{%- endif -%}
  {% if commit.remote.pr_number %} 在 \
[#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
{%- endif %}
{% endfor %}
{% endif %}

{% endfor -%}

{% if version %}
  {% if previous.version %}
**完整 Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
  {% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/rinlit-233-shiroko/class-widgets-2
{%- endmacro -%}

> [!TIP]
> 对于不方便使用 GitHub 的用户，欢迎使用 123 网盘和 OneDrive 来下载测试版本  
> [123 网盘下载](https://www.123912.com/s/DCyBTd-3iWxH) （无密码，以后的测试版也会持续同步至本链）  
> [OneDrive 下载](https://dl.gemen.pp.ua)

<!-- SHA256_CHECKSUMS -->
"""
trim = true
footer = "<!-- generated by git-cliff -->"
postprocessors = [
    { pattern = "<!-- SHA256_CHECKSUMS -->", replace_command = """sed '/<!-- SHA256_CHECKSUMS -->/d'
set -- dist/ClassWidgets-2-Windows.zip dist/ClassWidgets-*-Win-Installer.exe dist/ClassWidgets-2-macOS-X64.dmg dist/ClassWidgets-2-macOS-ARM64.dmg
found=false
for file in "$@"; do
  if [ -f "$file" ]; then
    found=true
    break
  fi
done
[ "$found" = true ] || exit 0
tag=""
release=false
targets="None"
if [ "$GITHUB_EVENT_NAME" = "push" ]; then
  tag="$GITHUB_REF_NAME"
  release=true
  targets="Both"
elif [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
  tag=$(jq -r '.inputs.version // ""' "$GITHUB_EVENT_PATH")
  release=$(jq -r '.inputs.release // "false"' "$GITHUB_EVENT_PATH")
  targets=$(jq -r '.inputs.upload2webdav // "None"' "$GITHUB_EVENT_PATH")
fi
printf '\\n### 文件摘要\\n\\n| 文件名 | SHA256 | 下载链接 |\\n| --- | --- | --- |\\n'
for file in "$@"; do
  [ -f "$file" ] || continue
  name=$(basename "$file")
  hash=$(sha256sum "$file" | awk '{print $1}')
  links=""
  if [ "$release" = "true" ]; then
    links="$links[GitHub](https://github.com/rinlit-233-shiroko/class-widgets-2/releases/download/$tag/$name) "
  fi
  case "$targets" in
    R2|Both) links="$links[R2 (美国)](https://cw2.helloswx.top/$tag/$name) [R2 (亚太)](https://cw2-apac.helloswx.top/$tag/$name) " ;;
  esac
  case "$targets" in
    OneDrive|Both) links="$links[OneDrive](https://dl.cw.helloswx.pp.ua/api/raw/?path=/$tag/$name) " ;;
  esac
  printf '| %s | `%s` | %s |\\n' "$name" "$hash" "$links"
done
""" },
]
output = "CHANGELOG.md"


[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "✨ 新亮点"},
    { message = "^fix", group = "🛠️ 修复的问题"},
    { message = "^refactor", group = "🔃 功能重构"},
    { message = "^docs", group = "📄 文档更新"},
    { message = "^style", group = "🏞️ 样式优化"},
]
protect_breaking_commits = false
filter_commits = true
topo_order = false
sort_commits = "oldest"
link_parsers = []
